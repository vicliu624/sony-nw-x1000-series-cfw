[platformio]
build_dir = ../../../../work/espnow-chat-cardputer-build
libdeps_dir = ../../../../work/espnow-chat-cardputer-libdeps

[env:cardputer-chat]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Cardputer@1.0.3
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    z3t0/IRremote@4.7.1
monitor_speed = 115200
upload_port = COM17
