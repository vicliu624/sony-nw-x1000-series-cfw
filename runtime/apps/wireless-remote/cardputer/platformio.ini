[platformio]
build_dir = ../../../../work/cardputer-remote-build
src_dir = main

[env:walkman-remote]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.esp-idf.sdkconfig_path = $X1000_REMOTE_SDKCONFIG_PATH
monitor_speed = 115200
upload_port = COM17
