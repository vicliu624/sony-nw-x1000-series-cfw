[platformio]
build_dir = ../../../../work/core2-remote-build
libdeps_dir = ../../../../work/core2-remote-libdeps

[env:walkman-core2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
board = m5stack-core2
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.3/esp32-3.3.3.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.3/esp32-3.3.3-libs.tar.xz
monitor_speed = 115200
build_unflags = -std=gnu++11 -std=gnu++17
build_flags = -std=gnu++20 -DBOARD_HAS_PSRAM
extra_scripts = pre:build_protocol.py
lib_deps =
    m5stack/M5Unified@0.2.11
    m5stack/M5GFX@0.2.32
    https://github.com/m5stack/M5Faces.git#28188e1820113a2caf1c21b3a948f574f3e535fe
