name: Build, verify and release X1000

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets (run on the matching version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: x1000-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - run: |
          python -m pip install -r requirements-ci.txt
          python tools/check_repository_layout.py
          python -m unittest discover -s tests -v
          python tools/test_release_protocol.py
          python tools/test_qqmusic_installation.py

  package:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - name: Install native build dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-12 gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi qemu-user p7zip-full make libssl-dev openssl pkg-config
          python -m pip install -r requirements-ci.txt
      - name: Build firmware, apps and repository from clean inputs
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/build_release.py --repository "$RELEASE_REPOSITORY"
          python tools/verify_release.py "dist/$(cat VERSION)/release"
          python tools/test_release_market.py "dist/$(cat VERSION)/release/upload"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x1000-release
          path: dist/*/release/upload/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiler/test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x1000-build-diagnostics
          path: work/ci/release-*/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name x1000-release --dir release
      - name: Publish immutable experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          python tools/publish_release.py release --repository "$GH_REPO" --tag "$RELEASE_TAG"
