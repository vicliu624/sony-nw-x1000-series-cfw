name: Build, verify and release X1000

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets (run on the matching version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: x1000-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.3'
      - run: |
          python -m pip install -r requirements-ci.txt
          python tools/check_repository_layout.py
          python -m unittest discover -s tests -v
          python tools/test_release_protocol.py
          python tools/test_qqmusic_installation.py

  package:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # setup-python's host library path must never reach the Sony ELF loader.
      QEMU_UNSET_ENV: LD_LIBRARY_PATH,LD_PRELOAD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.3'
      - name: Install native build dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-dev-armel-cross qemu-user p7zip-full make libssl-dev openssl pkg-config
          python -m pip install -r requirements-ci.txt
      - name: Build firmware, apps and repository from clean inputs
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/build_release.py --repository "$RELEASE_REPOSITORY"
          python tools/verify_release.py "dist/$(cat VERSION)/release"
          python tools/test_release_market.py "dist/$(cat VERSION)/release/upload"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x1000-release
          path: dist/*/release/upload/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiler/test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x1000-build-diagnostics
          path: |
            work/ci/release-*/*.log
            work/download-plan-tests/arm
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name x1000-release --dir release
      - name: Publish immutable experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          python tools/publish_release.py release --repository "$GH_REPO" --tag "$RELEASE_TAG"

