name: Build, verify and release X1000

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_firmware:
        description: Explicitly build experimental firmware (paused by default)
        type: boolean
        default: false
      publish:
        description: Publish assets (run on the matching version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: x1000-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Source-relocation checks compare with immutable migration commits.
          fetch-depth: 0
      - name: Select host regression scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -t offline_tools < config/ci-offline-tool-pathspecs.txt
          documentation=(
            ':(exclude,glob)docs/**' ':(exclude,glob)sdk/**/*.md' ':(exclude,glob)runtime/**/README.md'
            ':(exclude)README.md' ':(exclude)AGENTS.md' ':(exclude)CONTRIBUTING.md'
            ':(exclude)CHANGELOG.md' ':(exclude)THIRD_PARTY.md'
          )
          host=true
          compiled_host=true
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_REF" != refs/tags/* ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if git diff --quiet --no-renames "$BASE_SHA" HEAD -- . "${documentation[@]}"; then
              host=false
            fi
            if git diff --quiet --no-renames "$BASE_SHA" HEAD -- . "${documentation[@]}" "${offline_tools[@]}"; then
              compiled_host=false
            fi
          fi
          printf 'host=%s\ncompiled_host=%s\n' "$host" "$compiled_host" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.3'
      - name: Check repository layout and gallery
        run: |
          python tools/check_repository_layout.py
          python tools/check_readme_gallery.py
      - name: Check Python tooling contracts
        if: steps.scope.outputs.host == 'true'
        run: |
          python -m pip install -r requirements-ci.txt
          python -m unittest discover -s tests -v
      - name: Run source-only regressions
        if: steps.scope.outputs.compiled_host == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-12 g++-12
          python tools/test_release_protocol.py
          python tools/test_qqmusic_installation.py
          python tools/test_firmware_regressions.py --suite host
      - name: Preserve source-only regression evidence
        if: always() && steps.scope.outputs.compiled_host == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x1000-source-regressions
          path: work/firmware-regressions/
          if-no-files-found: warn
          retention-days: 14

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.build_firmware
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # setup-python's host library path must never reach the Sony ELF loader.
      QEMU_UNSET_ENV: LD_LIBRARY_PATH,LD_PRELOAD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.3'
      - name: Install native build dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-dev-armel-cross qemu-user p7zip-full make libssl-dev openssl pkg-config
          python -m pip install -r requirements-ci.txt
      - name: Create isolated application test volume
        run: |
          mkdir -p work
          sudo mount -t tmpfs -o size=2G,nodev,nosuid,mode=0755 tmpfs "$GITHUB_WORKSPACE/work"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/work"
      - name: Build firmware, apps and repository from clean inputs
        id: build
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/test_upg_crypto.py --codec-only
          python tools/build_release.py --repository "$RELEASE_REPOSITORY"
          python tools/verify_release.py "dist/$(cat VERSION)/release"
          python tools/test_download_plan.py
          python tools/test_app_presentation.py
          python tools/test_market_versions.py
          python tools/test_release_market.py "dist/$(cat VERSION)/release/upload"
          echo "upload=dist/$(cat VERSION)/release/upload" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x1000-release
          path: ${{ steps.build.outputs.upload }}/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiler/test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x1000-build-diagnostics
          path: |
            work/ci/release-*/*.log
            work/download-plan-tests/arm
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.build_firmware && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name x1000-release --dir release
      - name: Publish immutable experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          python tools/publish_release.py release --repository "$GH_REPO" --tag "$RELEASE_TAG"

