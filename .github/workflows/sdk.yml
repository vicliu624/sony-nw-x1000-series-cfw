name: X1000 experimental SDK

on:
  push:
    branches: [main]
    tags: ['sdk-v*']
    paths: ['sdk/**', 'runtime/platform/**', 'runtime/apps/sdk-*/**', 'runtime/**/README.md', 'tools/*sdk*.py', 'tools/build_app.py', 'tools/native_app_build.py', 'tools/app_registry.py', 'tools/app_presentation.py', 'tools/market_metadata.py', 'tools/verify_app_package.py', 'runtime/native/**', 'runtime/store/**', 'docs/**', 'scripts/upg*.py', 'VERSION', 'third_party/qqmusic-stb/Noto-OFL.txt', 'sources/downloads.json', 'sources/fm-comparison-sources.json', '.github/workflows/sdk.yml']
  pull_request:
    branches: [main]
    paths: ['sdk/**', 'runtime/platform/**', 'runtime/apps/sdk-*/**', 'runtime/**/README.md', 'tools/*sdk*.py', 'tools/build_app.py', 'tools/native_app_build.py', 'tools/app_registry.py', 'tools/app_presentation.py', 'tools/market_metadata.py', 'tools/verify_app_package.py', 'runtime/native/**', 'runtime/store/**', 'docs/**', 'scripts/upg*.py', 'VERSION', 'third_party/qqmusic-stb/Noto-OFL.txt', 'sources/downloads.json', 'sources/fm-comparison-sources.json', '.github/workflows/sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select source archive verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_REF" != refs/tags/* ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
             git diff --quiet --no-renames "$BASE_SHA" HEAD -- . \
               ':(exclude,glob)docs/**' ':(exclude,glob)sdk/**/*.md' ':(exclude,glob)runtime/**/README.md'; then
            echo 'full=false' >> "$GITHUB_OUTPUT"
          else
            echo 'full=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.3'
      - name: Install SDK toolchain
        if: steps.scope.outputs.full == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-dev-armel-cross qemu-user p7zip-full libsdl2-dev make
          python -m pip install -r sdk/requirements.txt
      # The main CI workflow covers these checks on main and its pull requests.
      - name: Verify repository on SDK tags and manual runs
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          python tools/check_repository_layout.py
          python -m unittest discover -s tests -p 'test_sdk_*.py' -v
      - name: Create and verify source-only archive
        env:
          FULL_SDK_CHECK: ${{ steps.scope.outputs.full }}
        run: |
          python tools/package_sdk.py
          version=$(cat sdk/VERSION)
          archive="dist/sdk/$version/x1000-sdk-$version-source.zip"
          if [[ "$FULL_SDK_CHECK" == true ]]; then
            python tools/test_sdk_bundle.py "$archive"
          else
            python tools/test_sdk_bundle.py "$archive" --archive-only
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x1000-sdk-source
          path: dist/sdk/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the checked source archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name x1000-sdk-source --dir sdk-release
      - name: Publish immutable experimental SDK source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SDK_TAG: ${{ github.ref_name }}
          SDK_SHA: ${{ github.sha }}
        run: |
          test "$SDK_TAG" = "sdk-v$(cat sdk/VERSION)"
          if gh release view "$SDK_TAG" >/dev/null 2>&1; then
            echo "An SDK release already exists; refusing replacement."
            exit 1
          fi
          gh release create "$SDK_TAG" --verify-tag --prerelease --title "X1000 SDK $(cat sdk/VERSION) (experimental)" --notes-file sdk/RELEASE_NOTES.md sdk-release/*/*.zip sdk-release/*/*.sha256
      - name: Refresh the developer portal after SDK publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
