name: X1000 Island · GitHub Pages

on:
  push:
    branches: [main]
    paths: ['website/**', 'runtime/apps/**/app.json', 'runtime/apps/**/VERSION', 'runtime/apps/**/assets/**', 'config/release.json', 'docs/images/**', 'VERSION', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['website/**', 'runtime/apps/**/app.json', 'runtime/apps/**/VERSION', 'runtime/apps/**/assets/**', 'config/release.json', 'docs/images/**', 'VERSION', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          WEBSITE_FETCH_RELEASES: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/website
  deploy:
    if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
